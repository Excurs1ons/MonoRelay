# MonoRelay - nginx on 8443
server {
    listen 443 ssl;
    listen 8444 ssl;
    server_name relay.521925.xyz;

    ssl_certificate /home/opc/.acme.sh/521925.xyz_ecc/fullchain.cer;
    ssl_certificate_key /home/opc/.acme.sh/521925.xyz_ecc/521925.xyz.key;

    # API Stream - SSE optimization
    location /api/logs/stream {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE specific
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 300;
    }

    # API routes -> MonoRelay
    location ~ ^/v[0-9]/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP
server {
    listen 80;
    server_name relay.521925.xyz;
    return 301 https://$host$request_uri;
}
